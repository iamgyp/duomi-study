<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="35%" stop-color="#2E7D32"/>
      <stop offset="35.1%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full background for maskable support -->
  <rect width="512" height="512" fill="#1E2328"/>

  <!-- Grass Block Badge -->
  <g filter="url(#shadow)">
    <!-- Main block frame -->
    <rect x="36" y="36" width="440" height="440" rx="64" fill="url(#bgGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="64" fill="none" stroke="#1B5E20" stroke-width="12"/>

    <!-- Grass decorative pixel drips -->
    <path d="M 40 180 L 90 180 L 90 220 L 140 220 L 140 180 L 200 180 L 200 230 L 250 230 L 250 180 L 320 180 L 320 220 L 370 220 L 370 180 L 430 180 L 430 210 L 472 210 L 472 180 L 472 70 Q 472 36 436 36 L 76 36 Q 40 36 40 70 Z" fill="#4CAF50"/>
    <path d="M 40 180 L 90 180 L 90 200 L 140 200 L 140 180 L 200 180 L 200 210 L 250 210 L 250 180 L 320 180 L 320 200 L 370 200 L 370 180 L 430 180 L 430 195 L 472 195 L 472 180 Z" fill="#81C784"/>

    <!-- Dirt pixel texture flecks -->
    <rect x="80" y="270" width="36" height="36" fill="#4E342E"/>
    <rect x="180" y="320" width="40" height="40" fill="#4E342E"/>
    <rect x="380" y="260" width="32" height="32" fill="#4E342E"/>
    <rect x="300" y="360" width="44" height="44" fill="#4E342E"/>
    <rect x="120" y="390" width="36" height="36" fill="#4E342E"/>
    
    <rect x="130" y="280" width="28" height="28" fill="#6D4C41"/>
    <rect x="340" y="310" width="32" height="32" fill="#6D4C41"/>
    <rect x="230" y="390" width="30" height="30" fill="#6D4C41"/>
    <rect x="420" y="350" width="24" height="24" fill="#6D4C41"/>
  </g>

  <!-- Central Diamond Emblem Circle -->
  <circle cx="256" cy="270" r="130" fill="#101820" stroke="#FFD700" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="256" cy="270" r="120" fill="#1E293B"/>

  <!-- Pixel Diamond in Center -->
  <g transform="translate(186, 200) scale(4.4)">
    <!-- 32x32 area inside -->
    <!-- Diamond Shape pixelated -->
    <polygon points="16,3 27,11 16,29 5,11" fill="#00E5FF"/>
    <!-- Facets -->
    <polygon points="16,3 21,11 16,29" fill="#00B0FF"/>
    <polygon points="16,3 11,11 16,29" fill="#40C4FF"/>
    <polygon points="16,3 16,29 27,11" fill="#0091EA" opacity="0.4"/>
    <polygon points="16,3 16,29 5,11" fill="#E0F7FA" opacity="0.4"/>
    <polygon points="11,11 21,11 16,29" fill="#00E5FF"/>
    <!-- Highlights -->
    <polygon points="16,5 18,10 16,12 14,10" fill="#FFFFFF"/>
    <!-- Outer Diamond Stroke -->
    <polygon points="16,3 27,11 16,29 5,11" fill="none" stroke="#004D40" stroke-width="1.2"/>
  </g>

  <!-- Golden Stars & Sparkles -->
  <path d="M 170 160 L 176 174 L 190 176 L 178 186 L 182 200 L 170 190 L 158 200 L 162 186 L 150 176 L 164 174 Z" fill="#FFD700"/>
  <path d="M 340 170 L 344 180 L 354 182 L 346 189 L 348 199 L 340 192 L 332 199 L 334 189 L 326 182 L 336 180 Z" fill="#FFD700"/>

  <!-- Top "DUOMI" Banner Text in Pixel Font Style -->
  <rect x="136" y="54" width="240" height="52" rx="8" fill="#000000" opacity="0.75"/>
  <text x="256" y="92" font-family="monospace, sans-serif" font-weight="900" font-size="34" fill="#FFE082" text-anchor="middle" letter-spacing="4">多米学习</text>
</svg>